name: strict-cmodel

on:
  push:
    branches:
      - agent/strict-stacked-sram-cmodel
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src/cmodel cmodel_main.py compare_cmodel.py scripts
      - run: PYTHONPATH=. pytest -q tests/test_strict_cmodel.py tests/test_strict_backends.py
      - run: |
          ! grep -RIn --include='*.py' -E 'getattr\(|\.get\(|try:|except[ :]' \
            src/cmodel cmodel_main.py compare_cmodel.py scripts

  external-backends:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update
      - run: sudo apt-get install -y build-essential cmake flex bison
      - run: python -m pip install -r requirements.txt
      - run: ./scripts/bootstrap_strict_backends.sh "$GITHUB_WORKSPACE"
