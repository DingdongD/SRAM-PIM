name: apply-strict-update

on:
  push:
    branches:
      - agent/strict-stacked-sram-cmodel

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/DingdongD/SRAM-PIM/pulls/1" |
            jq -r '.body' |
            base64 --decode > /tmp/strict-update.tar.xz
          echo "8b85cc22c5ddd20d5317cb984e82a671483c394401f7a2cb65cb603058eff9df  /tmp/strict-update.tar.xz" |
            sha256sum --check -
          rm -f \
            src/cmodel/architecture.py \
            src/cmodel/functional.py \
            src/cmodel/backends/recorded.py \
            tests/test_cmodel_engine.py \
            tests/test_cmodel_strictness.py
          tar -xJf /tmp/strict-update.tar.xz -C .
          rm -f .github/workflows/apply-strict-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "complete strict external co-simulation"
          git push origin HEAD:agent/strict-stacked-sram-cmodel
