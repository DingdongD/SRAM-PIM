name: apply-strict-update

on:
  push:
    branches:
      - agent/strict-stacked-sram-cmodel

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > /tmp/strict-final.b64
          for blob in \
            09fbc2997e7cb990cc8dcea40c3423be2ce00338 \
            7ebd00eb70ce3dc902f09d890335c059587146f2 \
            d672a3de4a988745d707201c1498ff9af2dcc242 \
            4849fcee33148281e509d3c58827824f2db59d3b
          do
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/DingdongD/SRAM-PIM/git/blobs/${blob}" |
              jq -r '.content' |
              base64 --decode >> /tmp/strict-final.b64
          done
          base64 --decode /tmp/strict-final.b64 > /tmp/strict-final.tar.xz
          echo "fbbe0331df07193262c0137369724d7215ca0b16fdaf8ec30ac134e4bec69171  /tmp/strict-final.tar.xz" |
            sha256sum --check -
          rm -f \
            src/cmodel/architecture.py \
            src/cmodel/functional.py \
            src/cmodel/backends/recorded.py \
            tests/test_cmodel_engine.py \
            tests/test_cmodel_strictness.py
          tar -xJf /tmp/strict-final.tar.xz -C .
          rm -f .github/workflows/apply-strict-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "complete strict external co-simulation"
          git push origin HEAD:agent/strict-stacked-sram-cmodel
